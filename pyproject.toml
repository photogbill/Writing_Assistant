# SPDX-License-Identifier: Apache-2.0
#
# The Writing Workshop is NOT published to PyPI. This file exists anyway,
# and has to be valid, because `pip install -e .` from a clone is what the
# installer does internally and what a contributor runs. The absence of an
# upload is not an excuse for an invalid manifest.
#
# Two rules here are load-bearing, and they are the same two Cognitive
# Coder settled on:
#
#   * requires-python is a FLOOR with no cap. An embedded library does not
#     get to dictate its host's interpreter. ATK ships its own 3.11.
#   * ZERO required runtime dependencies. Every craft measurement, the
#     context assembler, the claims model, the fingerprint and the diff are
#     stdlib arithmetic on purpose: that is what lets the workshop be
#     useful with the GPU cold, on a laptop, on a plane, and it is what
#     makes the measurements believable. Everything else is an extra whose
#     absence degrades a feature rather than crashing the tool.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-workshop"
description = "A workshop that knows the whole document better than the author can hold in their head, and never writes in the author's place."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bill", email = "photogbill@users.noreply.github.com" }]
keywords = ["writing", "manuscript", "continuity", "technical-writing",
            "offline", "local-models"]
dynamic = ["version"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# Each extra buys exactly one capability, and its absence degrades rather
# than crashes. The installer's summary names what each missing one costs.
docx = ["python-docx>=1.1"]             # Shunn + numbered .docx export
dev  = ["pytest>=8", "ruff>=0.6"]
all  = ["writing-workshop[docx,dev]"]

[project.scripts]
workshop = "writing_workshop.cli:main"

[project.urls]
Homepage = "https://github.com/photogbill/Writing-Workshop"
Source   = "https://github.com/photogbill/Writing-Workshop"

[tool.setuptools]
# `adapters/` is deliberately OUTSIDE the package. ATK's adapter imports
# PySide6 and atk.*; keeping it out of writing_workshop/ is what enforces
# the one-directional dependency mechanically rather than by intention.
packages = ["writing_workshop", "writing_workshop.craft",
            "writing_workshop.context", "writing_workshop.codex",
            "writing_workshop.continuity", "writing_workshop.room",
            "writing_workshop.export"]

[tool.setuptools.dynamic]
version = { attr = "writing_workshop.version.__version__" }

[tool.ruff]
line-length = 79                    # the ATK house style; keeps diffs narrow
target-version = "py311"
exclude = [".venv", "adapters"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
#: I001 is DELIBERATELY off, and it is worth saying why rather than
#: leaving twenty-eight permanent findings for somebody to "fix" one day.
#: This repo hand-wraps its imports compactly to 79 columns. `ruff check
#: --fix` cannot produce that -- it explodes every multi-name import to
#: one name per line -- and the layout it wants comes from `ruff format`,
#: which would rewrite about 7,500 lines of this repo in a style it does
#: not use. So the choice is: a lint that is permanently noisy, a
#: reformat nobody asked for, or saying out loud that the import style
#: here is hand-maintained. This is the third.
ignore = ["E501", "B008", "SIM105", "SIM102", "I001"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
force-sort-within-sections = true

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: takes more than a second",
           "needs_model: needs a language model the CI box does not have"]
